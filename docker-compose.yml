services:
  postgres:
    image: postgres:16
    container_name: wows-meta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wows_meta
      POSTGRES_USER: wows_user
      POSTGRES_PASSWORD: wows_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wows_user -d wows_meta"]
      interval: 5s
      timeout: 5s
      retries: 5

  wows-meta-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/varaprasad6700/wows-meta-service:latest
    container_name: wows-meta-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wows_meta
      SPRING_DATASOURCE_USERNAME: wows_user
      SPRING_DATASOURCE_PASSWORD: wows_password
      WARGAMING_APPLICATION_ID: "${WARGAMING_APPLICATION_ID:-demo_app_id}"

volumes:
  pgdata:
