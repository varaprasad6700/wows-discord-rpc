name: CI

on:
  push:
    branches: [ master, main, "feat/**" ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-mod:
    name: Test Python Telemetry Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Mod Unit Tests
        run: python -m unittest discover -s mod/tests

  test-daemon:
    name: Test & Build Go Daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Daemon Tests
        working-directory: daemon
        run: go test -v ./...

      - name: Build Windows Daemon Binary
        working-directory: daemon
        run: go build -v -ldflags="-s -w" -o ../wows-presence-daemon.exe ./cmd/daemon

  test-backend:
    name: Test & Build Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Test & Package Backend with Gradle
        working-directory: backend
        run: ./gradlew test bootJar
