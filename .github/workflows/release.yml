name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Windows Daemon Binary
        working-directory: daemon
        run: |
          go build -v -ldflags="-s -w" -o ../wows-presence-daemon.exe ./cmd/daemon

      - name: Create Release Archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ./release-package
          Copy-Item ./wows-presence-daemon.exe ./release-package/
          Copy-Item -Recurse ./mod ./release-package/mod
          Copy-Item ./config.example.yaml ./release-package/
          Copy-Item ./README.md ./release-package/
          Compress-Archive -Path ./release-package/* -DestinationPath ./wows-discord-rpc-windows-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./wows-discord-rpc-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
