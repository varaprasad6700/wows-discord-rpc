name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Windows Daemon Binary
        working-directory: daemon
        run: |
          go build -v -ldflags="-s -w" -o ../wows-presence-daemon.exe ./cmd/daemon

      - name: Create Release Archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ./release-package
          Copy-Item ./wows-presence-daemon.exe ./release-package/
          Copy-Item -Recurse ./mod ./release-package/mod
          Copy-Item ./config.example.yaml ./release-package/
          Copy-Item ./README.md ./release-package/
          Compress-Archive -Path ./release-package/* -DestinationPath ./wows-discord-rpc-windows-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ./wows-discord-rpc-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-docker:
    name: Build & Push Multi-Arch Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wows-meta-service
          tags: |
            type=raw,value=${{ github.event.inputs.tag_name || github.ref_name }}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
